<body style="background-color: #212121; color: wheat;">
    <ul class="lang">
        <li>Javasript</li>
    </ul>

</body>
<script>
    function addLang_name(langName) {
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.lang').appendChild(li)   
    }
    addLang_name("Typescript")

    function addLang_name2(langName){
        const li = document.createElement('li');
        const lang_node = document.createTextNode(langName)
        li.appendChild(lang_node);
        document.querySelector('.lang').appendChild(li);
    }
    addLang_name2("Python");
    addLang_name2("Java");
