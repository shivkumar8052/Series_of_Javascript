<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI_Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: grey;">
 <div class="container">
    <h1>BMI Calculator</h1>
    <form>
        <p><label>Height in cm:</label><input type="text" id="Height" placeholder="Enter Your Height in (CM)"></p>
        <p><label>Weight in Kg:</label><input type="text" id="Weight" placeholder="Enter Your weight in Kg"></p>
        <button >Calculate</button>
    </form>
    <div id="result"></div>

    <div class="result_guid">
        <h1>BMI Weight Guid:-</h1>
        <p>Under Weight = Less than 18.6</p>
        <p>Normal Range = 18.6 and 24.9 </p>
        <p>Overweight = Greater than 24.9</p>
    </div>

 </div>

  <script src="second.js"></script>  
</body>
</html>
