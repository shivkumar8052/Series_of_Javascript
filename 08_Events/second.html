<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="text-align: center;">
    <h1>Hello EveryOne !!</h1>
    <button id="stop">Click Me</button>   
</body>
<script>
    const change_text = function(){
        document.querySelector('h1').innerHTML = "My name is SHIV";
    }
    //Asynchronous Programing in js ......

    const changeMe = setTimeout(change_text, 3000);

    const button = document.getElementById('stop');

    button.addEventListener('click',function(){
        clearTimeout(changeMe); //stop the setTimeout execution 
        console.log("stopped")
    })
</script>
</html>
